name: Build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  assemble:
    name: assembleDebug (real Android SDK, unlike the sandboxed dev session)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compileSdk platform + build-tools
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: talon-debug-kleidi-on
          path: app/build/outputs/apk/debug/*.apk

  qwen-export-pilot:
    name: Export Qwen2.5-0.5B-Instruct .pte end-to-end (real pilot, not just a reachability check)
    runs-on: ubuntu-latest
    env:
      # Pinned once this job first went green end-to-end, so the cache key
      # below is stable across runs and upstream main can't change the
      # ground truth out from under us. Bump deliberately (new SHA, let CI
      # re-verify from a clean cache) — don't float on main.
      EXECUTORCH_REF: 52b176fd9d5d5252f5010e60f17adfea83e8433d
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone ExecuTorch checkout (pinned)
        run: |
          git clone --filter=blob:none https://github.com/pytorch/executorch.git
          cd executorch
          git checkout "$EXECUTORCH_REF"
          git submodule update --init --recursive --depth 1

      # Staged, content-addressed caching: each expensive step is gated on
      # its own cache-hit, so a run only re-executes the step(s) whose
      # inputs actually changed instead of redoing everything after any
      # single downstream fix. A cache miss falls through to the real
      # command — nothing here is allowed to silently skip on a bad cache.
      - name: Cache ExecuTorch install
        id: cache-env
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: executorch-env-${{ runner.os }}-${{ env.EXECUTORCH_REF }}-${{ hashFiles('scripts/requirements.txt') }}

      - name: Install ExecuTorch (dev/source path — required for extension.llm.export.export_llm and examples/)
        if: steps.cache-env.outputs.cache-hit != 'true'
        working-directory: executorch
        run: |
          python -m pip install --upgrade pip
          # install_requirements.sh only installs dependencies, not the
          # executorch package itself — extension/llm/export/export_llm
          # does `from executorch.extension...` (an absolute import), which
          # only resolves once `executorch` is actually pip-installed (its
          # pyproject.toml maps src/executorch/* -> * via package-dir, a
          # mapping setuptools only applies on an actual install). Confirmed
          # via CI failure 2026-08-10 — see REVIEW.md. install_executorch.py
          # runs the same dependency install AND does that `pip install .`
          # --minimal skips torchvision/torchaudio, unneeded for text LLMs.
          python install_executorch.py --minimal

      - name: Install this project's + export-only deps
        if: steps.cache-env.outputs.cache-hit != 'true'
        run: pip install -r scripts/requirements.txt huggingface_hub safetensors

      - name: Cache Qwen2.5-0.5B-Instruct checkpoint
        id: cache-checkpoint
        uses: actions/cache@v4
        with:
          path: qwen2.5-0.5b-hf
          # Bump the -v1 suffix only if the HF repo's contents ever change
          # underneath this pin; the checkpoint itself is otherwise static.
          key: qwen2.5-0.5b-instruct-checkpoint-v1

      - name: Download Qwen2.5-0.5B-Instruct checkpoint
        if: steps.cache-checkpoint.outputs.cache-hit != 'true'
        run: hf download Qwen/Qwen2.5-0.5B-Instruct --local-dir qwen2.5-0.5b-hf

      - name: Convert HF checkpoint to Meta format
        run: python3 scripts/convert_qwen_checkpoint.py qwen2.5-0.5b-hf qwen2.5-0.5b-meta.pth

      - name: Export + quantize .pte
        run: |
          python3 scripts/export_model.py --family qwen2_5 --model qwen2_5_0_5b \
            --checkpoint qwen2.5-0.5b-meta.pth \
            --params executorch/examples/models/qwen2_5/config/0_5b_config.json \
            --quant 4bit-groupwise --output-dir .

      - name: Report artifact
        run: ls -lh model.pte

      - name: Upload .pte
        uses: actions/upload-artifact@v4
        with:
          name: qwen2.5-0.5b-instruct-pte
          path: model.pte

      - name: Upload tokenizer (for the emulator-smoke-test workflow — already have it cached here)
        uses: actions/upload-artifact@v4
        with:
          name: qwen2.5-0.5b-instruct-tokenizer
          path: qwen2.5-0.5b-hf/tokenizer.json

  check-qwen3-artifact:
    name: Check pytorch/Qwen3-4B-INT8-INT4 .pte reachability (ungated?)
    runs-on: ubuntu-latest
    steps:
      - name: HEAD request against the pre-exported Qwen3 .pte
        run: |
          url="https://huggingface.co/pytorch/Qwen3-4B-INT8-INT4/resolve/main/model.pte"
          code=$(curl -sS -o /dev/null -w "%{http_code}" -L -I "$url")
          echo "HTTP status for $url: $code"
          if [ "$code" = "200" ]; then
            echo "Reachable without auth — looks ungated."
          else
            echo "Not reachable without auth (status $code) — likely gated or the path is wrong."
            exit 1
          fi
